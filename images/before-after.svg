<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe8e2" stop-opacity="0"/>
      <stop offset="1" stop-color="#ebe8e2" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1220" fill="#f7f5f0"/>

  <!-- Header -->
  <text x="40" y="62" font-size="32" font-weight="700" fill="#222">同一個問題，兩種回覆</text>

  <!-- Question -->
  <rect x="40" y="88" width="640" height="68" rx="34" fill="#2b2b2b"/>
  <text x="72" y="131" font-size="24" fill="#fff">「我想讓客戶自己換作品的配色，幫我想」</text>

  <!-- Ordinary AI reply -->
  <text x="40" y="208" font-size="22" font-weight="700" fill="#8a857c">一般 AI</text>
  <rect x="40" y="222" width="640" height="430" rx="18" fill="#ebe8e2"/>
  <g font-size="20" fill="#8a857c">
    <text x="68" y="264">好的！以下是幾種可以考慮的做法：</text>
    <text x="68" y="298">1. 設定頁：放 RGB 或 HSL 滑桿，讓客戶輸入色碼</text>
    <text x="68" y="332">2. 預設主題：提供淺色、深色、高對比等主題</text>
    <text x="68" y="366">3. 設定檔：用 JSON 儲存配色，方便版本控制</text>
    <text x="68" y="400">4. 色彩套件：整合現成的 color picker 元件</text>
    <text x="68" y="434">5. 權限管理：區分能改色和不能改色的帳號</text>
    <text x="68" y="468">6. A/B 測試：追蹤哪種配色轉換率比較高</text>
    <text x="68" y="502">每種做法各有優缺點，建議你先評估需求、</text>
    <text x="68" y="536">技術成本和目標使用者，再決定要用哪一種。</text>
    <text x="68" y="570">需要的話，我也可以幫你逐一比較 2 和 4 的……</text>
    <text x="68" y="604">另外也要考慮無障礙、色盲友善、品牌一致性……</text>
    <text x="68" y="638">如果客戶很多，也可以考慮多租戶架構……</text>
  </g>
  <rect x="40" y="502" width="640" height="150" rx="18" fill="url(#fade)"/>

  <!-- Art Thinking reply -->
  <text x="40" y="704" font-size="22" font-weight="700" fill="#d2551e">Art Thinking</text>
  <rect x="40" y="718" width="640" height="426" rx="18" fill="#ffffff" stroke="#f0c9b4" stroke-width="2"/>
  <rect x="40" y="718" width="10" height="426" rx="5" fill="#d2551e"/>

  <!-- Conclusion first -->
  <text x="76" y="770" font-size="27" font-weight="700" fill="#222">讓客戶直接在作品上拖著換色。</text>
  <line x1="76" y1="794" x2="644" y2="794" stroke="#f0c9b4" stroke-width="2"/>

  <g font-size="24" fill="#222">
    <text x="76" y="842"><tspan font-weight="700" fill="#d2551e">服務誰　</tspan>拿到作品、不懂技術的客戶</text>

    <text x="76" y="890"><tspan font-weight="700" fill="#d2551e">卡在哪　</tspan>色碼和英文欄位，客戶看不懂</text>

    <text x="76" y="942"><tspan font-weight="700" fill="#d2551e">提案　　</tspan><tspan font-weight="700">在作品上調</tspan></text>
    <text x="172" y="978">點畫面上那一塊，直接拖，邊拖邊看；</text>
    <text x="172" y="1014">下次打開，記得上次的顏色。</text>

    <text x="76" y="1066"><tspan font-weight="700" fill="#d2551e">之後　　</tspan>一鍵回到原作・手機上預覽</text>

    <text x="76" y="1114"><tspan font-weight="700" fill="#d2551e">標準　　</tspan>客戶不用問你，就能換好一次色</text>
  </g>

  <text x="360" y="1190" font-size="20" fill="#8a857c" text-anchor="middle">先講結論，一段一件事，手機一眼看完</text>
</svg>
